<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Coming Soon</title>
  <link rel="icon" href="favicon.svg" type="image/x-icon"/>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050905;
      --panel: #0b140b;
      --line: #173317;
      --text: #96ff96;
      --text-dim: #5abf5a;
      --glow: rgba(120, 255, 120, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 4vw, 24px);
      background:
        radial-gradient(circle at 50% -10%, rgba(70, 180, 70, 0.12), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .terminal {
      width: min(720px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(9, 18, 9, 0.95) 0%, rgba(6, 12, 6, 0.95) 100%);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.55),
        0 0 50px var(--glow);
      overflow: hidden;
    }

    .terminal__bar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(14, 24, 14, 0.7);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #2c5f2c;
      box-shadow: 0 0 6px rgba(100, 255, 100, 0.25);
    }

    .terminal__body {
      padding: clamp(18px, 4vw, 26px) clamp(16px, 4vw, 24px);
      min-height: clamp(150px, 30vh, 190px);
      font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing: 0.01em;
    }

    .line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      font-size: clamp(0.98rem, 2.7vw, 1.25rem);
      line-height: 1.7;
    }

    .prompt {
      color: var(--text-dim);
      margin-right: 10px;
      user-select: none;
    }

    #typed {
      white-space: pre;
    }

    .cursor {
      display: inline-block;
      width: 0.65ch;
      margin-left: 3px;
      color: var(--text);
      transform: translateY(-0.02em);
      animation: blink 1.1s ease-in-out infinite;
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.08;
      }
    }

    .hint {
      margin-top: 18px;
      font-size: clamp(0.8rem, 2.5vw, 0.86rem);
      color: #4f9f4f;
      opacity: 0.9;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main class="terminal" aria-label="Terminal style coming soon page">
    <div class="terminal__bar" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <section class="terminal__body">
      <div class="line">
        <span class="prompt">guest@param.sh:~$</span>
        <span id="typed"></span><span class="cursor" aria-hidden="true">|</span>
      </div>
    </section>
  </main>

  <script>
    (function typeMessage() {
      const target = document.getElementById("typed");
      const message = "Coming soon...";
      let index = 0;

      const timer = setInterval(() => {
        target.textContent += message.charAt(index);
        index += 1;

        if (index >= message.length) {
          clearInterval(timer);
        }
      }, 120);
    })();
  </script>
</body>
</html>
